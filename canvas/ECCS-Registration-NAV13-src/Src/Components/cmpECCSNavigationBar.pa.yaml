ComponentDefinitions:
  cmpECCSNavigationBar:
    DefinitionType: CanvasComponent
    Description: Site Navigation
    AccessAppScope: true
    Properties:
      Height: =75
      Width: =680
    Children:
      - shpNavigationHeader:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Fill: =ColorValue("#03173E")
            Height: =75
            Width: =680
            X: =2

      - btnHome4:
          Control: ModernButton@1.0.0
          Properties:
            Icon: ="Home"
            OnSelect: |-
              =Navigate(
                  scrLaunchPad,
                  ScreenTransition.Fade
              )
            Text: ="HOME"
            Width: =100
            X: =13
            Y: =21

      - btnBack4:
          Control: ModernButton@1.0.0
          Properties:
            Icon: ="ArrowLeft"
            OnSelect: =Back()
            Text: ="BACK"
            Width: =100
            X: =263
            Y: =21

      - btnRefresh4:
          Control: ModernButton@1.0.0
          Properties:
            Icon: ="ArrowSync"
            OnSelect: |-
              =Switch(
                  App.ActiveScreen,
                  scrRegistrationLaunchpad,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations');
                      Refresh(Locations);
                      Refresh(Services);
                      Refresh(Insurances);
                      Refresh('Room Beds');
                      Refresh('Discharge Dispositions');
                      Refresh('Insurance Auths');
                      Refresh('Financial Approvers');
                      Refresh('Financial Classes');
                      Refresh('Admit Source Mapping'),
                  scrAccommodations,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  srcMatchDashboard,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  scrWorksheetResults,
                      Refresh(Locations);
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  cmpECCSConfigurations,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  scrCutoverReadinessDash,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations');
                      Refresh(Locations);
                      Refresh(Services);
                      Refresh(Insurances);
                      Refresh('Room Beds');
                      Refresh('Discharge Dispositions');
                      Refresh('Insurance Auths');
                      Refresh('Financial Approvers');
                      Refresh('Financial Classes');
                      Refresh('Admit Source Mapping'),
                  scrLaunchPad,
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations')
              )
            Text: ="REFRESH"
            Width: =115
            X: =413
            Y: =21

      - btnNext4:
          Control: ModernButton@1.0.0
          Properties:
            Icon: ="ArrowRight"
            Layout: =ButtonLayout.IconAfter
            OnSelect: |-
              =Switch(
                  App.ActiveScreen,
                  scrLaunchPad,
                      Navigate(
                          scrRegistrationLaunchpad,
                          ScreenTransition.Fade
                      ),
                  scrRegistrationLaunchpad,
                      Navigate(
                          scrAccommodations,
                          ScreenTransition.Cover
                      ),
                  scrAccommodations,
                      Navigate(
                          cmpECCSConfigurations,
                          ScreenTransition.Cover
                      ),
                  cmpECCSConfigurations,
                      Navigate(
                          srcMatchDashboard,
                          ScreenTransition.Cover
                      ),
                  srcMatchDashboard,
                      Navigate(
                          scrWorksheetResults,
                          ScreenTransition.Cover
                      ),
                  scrWorksheetResults,
                      Navigate(
                          scrCutoverReadinessDash,
                          ScreenTransition.Cover
                      ),
                  scrCutoverReadinessDash,
                      Navigate(
                          scrLaunchPad,
                          ScreenTransition.Fade
                      ),
                  Navigate(
                      scrLaunchPad,
                      ScreenTransition.Fade
                  )
              )
            Text: ="NEXT"
            Width: =100
            X: =573
            Y: =21
