      - lblRegNextMilestone:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =16
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Today()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.EventName),
                      "No milestone scheduled",
                      nextEvent.EventName &
                      " | " &
                      Text(
                          nextEvent.StartDate,
                          "[$-en-US]mmmm d, yyyy"
                      )
                  )
              )
            Width: =300
            X: =562
            Y: =13
      - lblRegCountdownLaunchpad:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =20
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Now()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.EventName),
                      "COUNTDOWN NOT CONFIGURED",
                      With(
                          {
                              totalMinutes: DateDiff(
                                  Now(),
                                  nextEvent.StartDate,
                                  TimeUnit.Minutes
                              )
                          },
                          If(
                              totalMinutes <= 0,
                              "EVENT ACTIVE",
                              Int(totalMinutes / 1440) &
                              "d " &
                              Mod(
                                  Int(totalMinutes / 60),
                                  24
                              ) &
                              "h " &
                              Mod(
                                  totalMinutes,
                                  60
                              ) &
                              "m"
                          )
                      )
                  )
              )
            Width: =200
            X: =606
            Y: =50
      - lblRegWorksheetReadinessHeader:
