            X: =630
            Y: =185
      - lblRegWorksheetReadiness:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            Height: =261
            Size: =16
            Text: |-
              =Concat(
                  Sort(
                      colRegReadiness,
                      WorksheetName,
                      SortOrder.Ascending
                  ),
                  WorksheetName &
                  "    " &
                  Text(TotalRecords) &
                  " records    " &
                  Text(
                      Round(
                          100 *
                          (
                              TestRecords +
                              ZconRecords +
                              LiveRecords
                          ) /
                          Max(
                              1,
                              TotalRecords
                          ),
                          0
                      )
                  ) &
                  "% mapped    " &
                  Text(
                      Round(
                          100 *
                          LiveRecords /
                          Max(
                              1,
                              TotalRecords
                          ),
                          0
                      )
                  ) &
                  "% LIVE    " &
                  Text(NoMatchRecords) &
                  " NO MATCH" &
                  Char(10)
              )
            VerticalAlign: =VerticalAlign.Top
            Width: =636
            X: =630
            Y: =221
