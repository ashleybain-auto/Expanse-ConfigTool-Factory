ComponentDefinitions:
  cmpDrpdwnFiltersFacility:
    DefinitionType: CanvasComponent
    Description: Wave Facility Dropdown
    AccessAppScope: true
    Properties:
      Height: =75
      Width: =620
    Children:
      - lblGlbWaveSubwave:
          Control: ModernText@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Text: ="WAVE - SUBWAVE"
            Width: =240
            X: =5
            Y: =3

      - drpWaveSubWave:
          Control: ModernDropdown@1.0.3
          Properties:
            Font: =Font.'Open Sans'
            ItemDisplayText: =ThisItem.Value
            Items: |-
              =Sort(
                  Distinct(
                      Filter(
                          'dim.Ref.Organizations',
                          !IsBlank('Wave Number') &&
                          'Wave Number' <> "Wave" &&
                          'Wave Number' <> "NULL" &&
                          !IsBlank('SubWave2 Code') &&
                          'SubWave2 Code' <> "SubWave" &&
                          'SubWave2 Code' <> "NULL"
                      ),
                      'Wave Number' & " - " & 'SubWave2 Code'
                  ),
                  Value,
                  SortOrder.Ascending
              )
            OnChange: |-
              =Set(
                  gblSelectedWaveNumber,
                  First(
                      Split(
                          drpWaveSubWave.Selected.Value,
                          " - "
                      )
                  ).Value
              );
              Set(
                  gblSelectedSubWaveCode,
                  Last(
                      Split(
                          drpWaveSubWave.Selected.Value,
                          " - "
                      )
                  ).Value
              );
              Set(
                  gblSelectedFacility,
                  Blank()
              );
              Set(
                  gblSelectedNetworkMnemonic,
                  Blank()
              )
            Width: =260
            X: =5
            Y: =32

      - lblGlbFacilityMneName:
          Control: ModernText@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Text: ="FACILITY MNEMONIC/NAME"
            Width: =250
            X: =325
            Y: =3

      - drpFacilityMnemName:
          Control: ModernDropdown@1.0.3
          Properties:
            Font: =Font.'Open Sans'
            ItemDisplayText: =ThisItem.'Facility Mnemonic'
            Items: |-
              =Sort(
                  Filter(
                      'dim.Ref.Organizations',
                      !IsBlank('Facility Mnemonic') &&
                      'Facility Mnemonic' <> "Facility Mnemonic" &&
                      'Facility Mnemonic' <> "NULL" &&
                      (
                          IsBlank(gblSelectedWaveNumber) ||
                          'Wave Number' = gblSelectedWaveNumber
                      ) &&
                      (
                          IsBlank(gblSelectedSubWaveCode) ||
                          'SubWave2 Code' = gblSelectedSubWaveCode
                      )
                  ),
                  'Facility Mnemonic',
                  SortOrder.Ascending
              )
            OnChange: |-
              =Set(
                  gblSelectedFacility,
                  drpFacilityMnemName.Selected.'Facility Mnemonic'
              );
              Set(
                  gblSelectedNetworkMnemonic,
                  drpFacilityMnemName.Selected.'Network Mnemonic'
              )
            Width: =285
            X: =325
            Y: =32
