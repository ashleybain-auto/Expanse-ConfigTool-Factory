                  )
              )
          },
          {
              WorksheetName: "Financial Class",
              TotalRecords: CountRows('Financial Classes'),
              NoMatchRecords: CountRows(
                  Filter(
                      'Financial Classes',
                      'Target Match Matrix' = "NO MATCH"
                  )
              ),
              TestRecords: CountRows(
                  Filter(
                      'Financial Classes',
                      StartsWith('Target Match Matrix', "TEST")
                  )
              ),
              ZconRecords: CountRows(
                  Filter(
