App:
  Properties:
    OnStart: |-
      =Set(
          gblDashboardExpanded,
          false
      );
      Set(
          gblSelectedMatchCategory,
          ""
      );
      Set(
          gblSelectedWorksheet,
          ""
      );
      ClearCollect(
          colMatchDashboard,
          {
              MatchCategory: "NO MATCH",
              DisplayLabel: "No Match"
          },
          {
              MatchCategory: "TEST",
              DisplayLabel: "TEST"
          },
          {
              MatchCategory: "ZCON",
              DisplayLabel: "ZCON"
          },
          {
              MatchCategory: "LIVE",
              DisplayLabel: "LIVE"
          }
      );
      ClearCollect(
          colRegReadiness,
          {
              WorksheetName: "Accommodations",
              TotalRecords: CountRows('Accommodation Data Clone'),
              NoMatchRecords: CountRows(
                  Filter(
                      'Accommodation Data Clone',
                      TargetMatchMtx = "NO MATCH"
                  )
              ),
              TestRecords: CountRows(
                  Filter(
                      'Accommodation Data Clone',
                      StartsWith(TargetMatchMtx, "TEST")
                  )
              ),
              ZconRecords: CountRows(
                  Filter(
                      'Accommodation Data Clone',
                      StartsWith(TargetMatchMtx, "ZCON")
                  )
              ),
              LiveRecords: CountRows(
                  Filter(
                      'Accommodation Data Clone',
                      StartsWith(TargetMatchMtx, "LIVE")
                  )
              )
          },
          {
              WorksheetName: "Locations",
              TotalRecords: CountRows(Locations),
              NoMatchRecords: CountRows(
                  Filter(
                      Locations,
                      'Target Match Matrix' = "NO MATCH"
                  )
              ),
              TestRecords: CountRows(
                  Filter(
                      Locations,
                      StartsWith('Target Match Matrix', "TEST")
                  )
              ),
              ZconRecords: CountRows(
                  Filter(
                      Locations,
                      StartsWith('Target Match Matrix', "ZCON")
                  )
              ),
              LiveRecords: CountRows(
                  Filter(
                      Locations,
                      StartsWith('Target Match Matrix', "LIVE")
                  )
              )
          },
          {
              WorksheetName: "Services",
              TotalRecords: CountRows(Services),
              NoMatchRecords: CountRows(
                  Filter(
                      Services,
                      'Target Match Matrix' = "NO MATCH"
                  )
              ),
              TestRecords: CountRows(
                  Filter(
                      Services,
                      StartsWith('Target Match Matrix', "TEST")
                  )
              ),
              ZconRecords: CountRows(
                  Filter(
                      Services,
                      StartsWith('Target Match Matrix', "ZCON")
                  )
              ),
              LiveRecords: CountRows(
                  Filter(
                      Services,
                      StartsWith('Target Match Matrix', "LIVE")
                  )
              )
          },
          {
              WorksheetName: "Insurance",
              TotalRecords: CountRows(Insurances),
              NoMatchRecords: CountRows(
                  Filter(
                      Insurances,
                      'Target Match Matrix' = "NO MATCH"
                  )
              ),
              TestRecords: CountRows(
                  Filter(
                      Insurances,
                      StartsWith('Target Match Matrix', "TEST")
                  )
              ),
              ZconRecords: CountRows(
                  Filter(
                      Insurances,
                      StartsWith('Target Match Matrix', "ZCON")
                  )
              ),
              LiveRecords: CountRows(
                  Filter(
                      Insurances,
                      StartsWith('Target Match Matrix', "LIVE")
                  )
              )
          },
          {
              WorksheetName: "RoomBed",
              TotalRecords: CountRows('Room Beds'),
              NoMatchRecords: CountRows(
                  Filter(
                      'Room Beds',
                      'Target Match Status' = "NO MATCH"
                  )
