      )
            ClearCollect(
          colECCSCutoverSchedule,
          {
              EventName: "3A UAT - EFL",
              Phase: "UAT",
              StartDate: DateTimeValue("2026-09-03T00:00:00"),
              FinishDate: DateTimeValue("2026-09-11T00:00:00")
