ComponentDefinitions:
  cmpECCSCutoverReadinessDsh:
    DefinitionType: CanvasComponent
    Description: ReadinessDashboard
    AccessAppScope: true
    Properties:
      Height: =700
      Width: =1200
    Children:
      - shpReadinessDash:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Fill: '=ColorValue("#03173E") '
            Width: =1200
      - shpReadinessSidePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Fill: =ColorValue("#03173E")
            Height: =700
            Width: =126
      - lblReadinessSubTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =45
            Size: =16
            Text: ="Cutover Automation Configuation Readiness"
            Width: =634
            X: =126
            Y: =39
      - lblReadinessDashTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =20
            Text: ="Expanse Cutover Automation Readiness Dashboard"
            Width: =607
            X: =126
            Y: =11
      - txtLogoExpanse:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Text: ="Expanse"
            Width: =75
            X: =13
            Y: =57
      - imgHCALogo2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Height: =46
            Image: =HCA_Healthcare_Logo_Extracted
            X: =13
            Y: =11
      - lblRegReadiness:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =16
            Text: ="REGISTRATION READINESS"
            Width: =300
            X: =150
            Y: =90

      - lblRegOverallValue:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =28
            Text: |-
              =Text(
                  Round(
                      100 *
                      Sum(
                          colRegReadiness,
                          LiveRecords
                      ) /
                      Max(
                          1,
                          Sum(
                              colRegReadiness,
                              TotalRecords
                          )
                      ),
                      0
                  )
              ) & "%"
            Width: =150
            X: =150
            Y: =135

      - lblRegOverallCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Overall Readiness"
            Width: =180
            X: =150
            Y: =180

      - lblRegConfigValue:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: |-
              =CountRows(
                  Filter(
                      colRegReadiness,
                      TotalRecords > 0
                  )
              ) & " / " & CountRows(colRegReadiness)
            Width: =120
            X: =360
            Y: =135

      - lblRegConfigCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Worksheets"
            Width: =140
            X: =360
            Y: =180

      - lblRegMappingValue:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: |-
              =Text(
                  Round(
                      100 *
                      (
                          Sum(
                              colRegReadiness,
                              TestRecords
                          ) +
                          Sum(
                              colRegReadiness,
                              ZconRecords
                          ) +
                          Sum(
                              colRegReadiness,
                              LiveRecords
                          )
                      ) /
                      Max(
                          1,
                          Sum(
                              colRegReadiness,
                              TotalRecords
                          )
                      ),
                      0
                  )
              ) & "%"
            Width: =120
            X: =535
            Y: =135
      - lblRegMappingCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Mapped"
            Width: =120
            X: =535
            Y: =180

      - lblRegValidationValue:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: |-
              =Text(
                  Round(
                      100 *
                      Sum(
                          colRegReadiness,
                          LiveRecords
                      ) /
                      Max(
                          1,
                          Sum(
                              colRegReadiness,
                              TotalRecords
                          )
                      ),
                      0
                  )
              ) & "%"
            Width: =120
            X: =700
            Y: =135

      - lblRegValidationCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="LIVE"
            Width: =120
            X: =700
            Y: =180

      - lblRegOpenIssuesValue:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: |-
              =Text(
                  Sum(
                      colRegReadiness,
                      NoMatchRecords
                  )
              )
            Width: =120
            X: =865
            Y: =135

      - lblRegOpenIssuesCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="NO MATCH"
            Width: =140
            X: =865
            Y: =180

      - lblRegEventDate:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =14
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Today()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "No milestone scheduled",
                      nextEvent.EventName &
                      " | " &
                      Text(
                          nextEvent.StartDate,
                          "[$-en-US]mmmm d, yyyy"
                      )
                  )
              )
            Width: =500
            X: =150
            Y: =240

      - lblRegCountdown:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =22
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Now()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "COUNTDOWN NOT CONFIGURED",
                      With(
                          {
                              totalMinutes: DateDiff(
                                  Now(),
                                  nextEvent.StartDate,
                                  TimeUnit.Minutes
                              )
                          },
                          If(
                              totalMinutes <= 0,
                              "EVENT ACTIVE",
                              Int(totalMinutes / 1440) &
                              "d " &
                              Mod(
                                  Int(totalMinutes / 60),
                                  24
                              ) &
                              "h " &
                              Mod(
                                  totalMinutes,
                                  60
                              ) &
                              "m"
                          )
                      )
                  )
              )
            Width: =400
            X: =150
            Y: =275
