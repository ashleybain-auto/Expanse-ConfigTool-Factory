Screens:
  cmpECCSConfigurations:
    Properties:
      Fill: =RGBA(232, 232, 232, 1)
      Height: =700
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      Width: =1200
    Children:
      - cmpDrpdwnFiltersFacility_2:
          Control: CanvasComponent
          ComponentName: cmpDrpdwnFiltersFacilityWks
          Properties:
            Height: =616
            Width: =625
            Y: =84
      - cmpECCSConfigurationBoard_1:
          Control: CanvasComponent
          ComponentName: cmpECCSConfigurationBoard
          Properties:
            BoardTitle: ="Expanse Cutover Configuration & Suite"
            Fill: =ColorValue("#F5F7FA")
            Height: =700
            Records: |-
              =Table(
                  {
                      RecordKey: "",
                      SourceFacility: "",
                      SourceMnemonic: "",
                      SourceName: "",
                      SourcePACode: "",
                      SourceActive: "",
                      TargetFacility: "",
                      TargetMnemonic: "",
                      TargetName: "",
                      TargetPACode: "",
                      TargetActive: "",
                      TargetMatchMtx: ""
                  }
              )
            WaveSubwaveFacilitySearch: ="Text"
            Width: =1200
            WorksheetName: ="Registration | Configuration Review"
            X: =6
