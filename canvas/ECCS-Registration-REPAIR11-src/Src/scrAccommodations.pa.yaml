      - btnUpdateSaveTarget:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(0, 51, 102, 1), -20%)
            OnSelect: |-
              =If(
                  IsBlank(gblSelectedAccommodation),
                  Notify(
                      "Select a Registration record before updating the target.",
                      NotificationType.Warning
                  ),
                  IfError(
                      Patch(
                          'Accommodation Data Clone',
                          LookUp(
                              'Accommodation Data Clone',
                              FacilityMnem_Source = gblSelectedAccommodation.SourceFacility &&
                              Accommodation_Mnem_Source = gblSelectedAccommodation.SourceMnemonic &&
                              Accommodation_Name_Source = gblSelectedAccommodation.SourceName &&
                              PA_Code_Source = gblSelectedAccommodation.SourcePACode
                          ),
                          {
                              FacilityMnem_Target: txtTargetFacility.Text,
                              Accommodation_Mnem_Target: txtTargetMnem.Text,
                              Accommodation_Name_Target: txtTargetName.Text,
                              PA_Code_Target: txtTargetPACode.Text,
                              Active_Target_Value: txtTargetActive.Text,
                              Update_User: User().FullName,
                              Update_Datetime: Now()
                          }
                      ),
                      Notify(
                          "Update failed: " & FirstError.Message,
                          NotificationType.Error
                      ),
                      Notify(
                          "Target configuration updated.",
                          NotificationType.Success
                      );
                      Refresh('Accommodation Data Clone')
                  )
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Update Target"
            Width: =204
            X: =956
            Y: =618
