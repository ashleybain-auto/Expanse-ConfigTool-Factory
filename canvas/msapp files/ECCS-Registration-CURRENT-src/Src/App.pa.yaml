App:
  Properties:
    OnStart: |-
      =Set(
          gblDashboardExpanded,
          false
      );
      Set(
          gblSelectedMatchCategory,
          ""
      );
      Set(
          gblSelectedWorksheet,
          ""
      );
      ClearCollect(
          colMatchDashboard,
          {
              MatchCategory: "NO MATCH",
              DisplayLabel: "No Match"
          },
          {
              MatchCategory: "TEST",
              DisplayLabel: "TEST"
          },
          {
              MatchCategory: "ZCON",
              DisplayLabel: "ZCON"
          },
          {
              MatchCategory: "LIVE",
              DisplayLabel: "LIVE"
          }
      )
    Theme: =PowerAppsTheme
